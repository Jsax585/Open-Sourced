<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title data-omp-i18n>Session Export</title>
  <template-css/>
  <theme-vars/>
  <script>try{const t=localStorage.getItem("omp-export-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch{}</script>
</head>
<body>
  <button id="hamburger" title="Open sidebar" aria-label="Open sidebar" data-omp-i18n-attrs="title aria-label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <div id="sidebar-overlay"></div>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-controls">
          <input type="text" class="sidebar-search" id="tree-search" placeholder="Search entries…" autocomplete="off" spellcheck="false" data-omp-i18n-attrs="placeholder">
          <select class="theme-select" id="theme-select" title="Color theme" aria-label="Color theme" data-omp-i18n-attrs="title aria-label">
            <option value="auto" data-omp-i18n>Auto</option>
            <option value="light" data-omp-i18n>Light</option>
            <option value="dark" data-omp-i18n>Dark</option>
          </select>
        </div>
        <div class="sidebar-filters">
          <button class="filter-btn active" data-filter="default" title="Hide settings entries" data-omp-i18n data-omp-i18n-attrs="title">Default</button>
          <button class="filter-btn" data-filter="no-tools" title="Default minus tool results" data-omp-i18n data-omp-i18n-attrs="title">No-tools</button>
          <button class="filter-btn" data-filter="user-only" title="Only user messages" data-omp-i18n data-omp-i18n-attrs="title">User</button>
          <button class="filter-btn" data-filter="labeled-only" title="Only labeled entries" data-omp-i18n data-omp-i18n-attrs="title">Labeled</button>
          <button class="filter-btn" data-filter="all" title="Show everything" data-omp-i18n data-omp-i18n-attrs="title">All</button>
          <button class="sidebar-close" id="sidebar-close" title="Close" aria-label="Close sidebar" data-omp-i18n-attrs="title aria-label">✕</button>
        </div>
      </div>
      <div class="tree-container" id="tree-container"></div>
      <div class="tree-status" id="tree-status"></div>
    </aside>
    <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize session tree sidebar" data-omp-i18n-attrs="aria-label"></div>
    <main id="content">
      <div id="header-container"></div>
      <div id="messages"></div>
    </main>
    <div id="image-modal" class="image-modal">
      <img id="modal-image" src="" alt="">
    </div>
  </div>

  <script id="session-data" type="application/json">{{SESSION_DATA}}</script>
  <template-i18n/>
  <template-marked/>
  <template-highlight/>
  <template-tool-views/>
  <template-js/>
</body>
</html>
