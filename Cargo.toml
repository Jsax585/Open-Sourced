[workspace]
members = ["crates/*"]
exclude = ["crates/brush-core-vendored", "crates/brush-builtins-vendored"]
resolver = "3"

[workspace.package]
version = "14.7.3"
edition = "2024"
license = "MIT"
authors = ["Can Boluk"]
repository = "https://github.com/can1357/oh-my-pi"

[patch.crates-io]
brush-core = { path = "crates/brush-core-vendored" }
brush-builtins = { path = "crates/brush-builtins-vendored" }

# Shared dependency versions for the workspace. Vendored crates from upstream
# (pi-diff, pi-walker, pi-ast, pi-edit) declare `dep.workspace = true`, so the
# versions they resolve against live here rather than in each crate manifest.
[workspace.dependencies]
# Intra-workspace crates vendored from upstream.
pi-ast = { path = "crates/pi-ast" }
pi-diff = { path = "crates/pi-diff" }
pi-walker = { path = "crates/pi-walker" }

anyhow = "1.0"
async-trait = "0.1"
dashmap = "6.1"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
parking_lot = "0.12.5"
rayon = "1.12"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
windows-sys = { version = "0.61" }
xutf = "1.4"
# xxh32 is required by pi-edit's hashline anchors; pi-natives only needed xxh64.
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh32"] }

# Parser stack shared by pi-ast and pi-natives. Versions were previously pinned
# only in pi-natives; promoted verbatim so the two cannot drift.
ast-grep-core = { version = "0.39", default-features = false, features = [
   "tree-sitter",
] }
phf = { version = "0.13", features = ["macros"] }
tree-sitter = "0.25"
tree-sitter-astro = { version = "0.1.1", package = "tree-sitter-astro-next" }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-clojure = "0.1"
tree-sitter-cmake = "0.7.1"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.2"
tree-sitter-diff = "0.1"
tree-sitter-dockerfile = { version = "0.2.0", package = "tree-sitter-dockerfile-updated" }
tree-sitter-elisp = "1.6.1"
tree-sitter-elixir = "0.3"
tree-sitter-erlang = "0.16.0"
tree-sitter-fortran = "0.6.0"
tree-sitter-go = "0.25"
tree-sitter-graphql = "0.1.0"
tree-sitter-haskell = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-html = "0.23"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-julia = "0.23"
tree-sitter-just = "0.2.0"
tree-sitter-kotlin = { version = "0.4", package = "tree-sitter-kotlin-sg" }
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-ocaml = "0.24.2"
tree-sitter-odin = "1.3"
tree-sitter-perl = { version = "0.1.0", package = "tree-sitter-perl-next" }
tree-sitter-php = "0.24"
tree-sitter-powershell = "0.26.4"
tree-sitter-proto = "0.4.0"
tree-sitter-python = "0.25"
tree-sitter-r = "1.2.0"
tree-sitter-regex = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-solidity = "1.2"
tree-sitter-sql = { version = "0.3.11", package = "tree-sitter-sequel" }
tree-sitter-starlark = "1.3"
tree-sitter-svelte = { version = "0.1.1", package = "tree-sitter-svelte-next" }
tree-sitter-swift = "0.7"
tree-sitter-tlaplus = "1.5"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-verilog = "1.0"
tree-sitter-vue = { version = "0.1.0", package = "tree-sitter-vue-next" }
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Unwind (not abort) so panics inside native code stay recoverable at the
# boundaries that already try to catch them. `catch_unwind` is a no-op under
# `panic = "abort"`: the process dies at the panic site instead of unwinding.
# The shell minimizer (crates/pi-natives/src/shell/minimizer/engine.rs) relies
# on catching panics in filter/pipeline code to fall back to passthrough
# output, so under `abort` a panic in a minimizer filter killed the agent
# rather than degrading to unminimized output.
panic = "unwind"

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
strip = "none"
split-debuginfo = "off"

[profile.local]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
strip = false

[profile.dev]
opt-level = 3
lto = "thin"
codegen-units = 16

[workspace.lints.rust]
# Vendored upstream crates use the pre-2024 lifetime elision style in places.
mismatched_lifetime_syntaxes = "allow"

[workspace.lints.clippy]
# Base Lint Levels
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Meta: Lint Attributes
allow_attributes_without_reason = "warn"

# Safety & Unsafe Code
undocumented_unsafe_blocks = "warn"

# Numeric Casts & Conversions
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

# Functions & Closures
inline_always = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"

# Structs & Types
missing_fields_in_debug = "allow"
struct_excessive_bools = "allow"

# Pattern Matching
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
option_if_let_else = "allow"

# Imports & Module Organization
enum_glob_use = "allow"
items_after_statements = "allow"
wildcard_imports = "allow"

# Variables & Type Inference
similar_names = "allow"

# Literals & Formatting
unreadable_literal = "allow"

# Code Style
default_trait_access = "allow"
significant_drop_tightening = "allow"

# Documentation
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Complexity
too_many_lines = "allow"
too_many_arguments = "allow"
